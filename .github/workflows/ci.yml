name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run quality gate
        run: make check

  full-tests:
    name: Full suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.0,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm
      - name: Run full quality gate
        run: make full-check
