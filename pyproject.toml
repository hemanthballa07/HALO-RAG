[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "results", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the full ML dependency stack and may download model assets",
]
