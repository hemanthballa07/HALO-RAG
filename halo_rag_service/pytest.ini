[pytest]
# Pytest configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that require model loading (slow)
    unit: Unit tests with mocked dependencies (fast)

# Coverage
addopts = 
    --verbose
    --strict-markers
    -ra

# Async support
asyncio_mode = auto
